<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>LEAP — 시작하기</title>
<link rel="stylesheet" href="onboarding.css?v=3" />
</head>
<body>
  <div class="ob-page">

    <!-- Step 1: Splash -->
    <section class="ob-step ob-step--splash" id="stepSplash">
      <img class="ob-logo" id="obLogo" src="assets/logo.png" alt="LEAP" />
    </section>

    <!-- Step 2: Intro -->
    <section class="ob-step ob-step--intro" id="stepIntro" hidden>
      <div class="ob-intro-text">
        <p class="ob-line" data-line="1">환영합니다!</p>
        <p class="ob-line" data-line="2">이미지 기반 소셜 학습 플랫폼</p>
        <p class="ob-line" data-line="3">LEAP입니다.</p>
      </div>
    </section>

    <!-- Step 3: Name input -->
    <section class="ob-step ob-step--name" id="stepName" hidden>
      <h2 class="ob-name-title">당신의 이름을 알려주세요.</h2>

      <div class="ob-name-input-wrap">
        <input type="text" id="nameInput" class="ob-name-input" aria-label="이름" autocomplete="off" />
      </div>

      <div class="ob-voice">
        <button class="ob-mic" id="btnMic" aria-label="음성으로 입력">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <p class="ob-voice-hint" id="obVoiceHint">더 도움이 필요하다면, 직접 이야기해 주세요!</p>
      </div>

      <footer class="ob-chat-bar ob-chat-bar--end">
        <button class="ob-chat-send" id="btnNameNext" aria-label="다음">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12 20 4l-6 16-3-7-7-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="currentColor"/></svg>
        </button>
      </footer>
    </section>

    <!-- Step 4: Language selection -->
    <section class="ob-step ob-step--lang" id="stepLang" hidden>
      <header class="ob-lang-topbar">
        <button class="ob-back" id="btnLangBack" aria-label="뒤로가기">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>
      <h2 class="ob-lang-title">
        <span class="ob-lang-greeting" id="obGreeting">안녕하세요 회원님!</span>
        <span class="ob-lang-question">배우고자 하는 언어를 알려주세요.</span>
      </h2>

      <div class="ob-lang-input-wrap">
        <input type="text" id="langInput" class="ob-lang-input" placeholder="" aria-label="언어 선택" autocomplete="off" readonly />
        <ul class="ob-lang-dropdown" id="langDropdown" hidden></ul>
      </div>

      <footer class="ob-chat-bar ob-chat-bar--end">
        <button class="ob-chat-send" id="btnLangNext" aria-label="다음">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12 20 4l-6 16-3-7-7-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="currentColor"/></svg>
        </button>
      </footer>
    </section>

  </div>

  <script src="onboardview.js?v=4"></script>
</body>
</html>
