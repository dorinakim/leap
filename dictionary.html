<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>단어 — 사전 정보</title>
<link rel="stylesheet" href="styles.css?v=1" />
<link rel="stylesheet" href="dictionary.css?v=2" />
<link rel="stylesheet" href="edit.css?v=2" />
</head>
<body class="dict-body">
  <div class="dict-page">
    <header class="dict-topbar">
      <button class="dict-back" id="btnBack" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="dict-home-logo" id="logoHome" href="index.html">단어</a>
    </header>

    <div class="dict-content">
      <div class="dict-photo-wrap">
        <img class="dict-photo" id="dictPhoto" alt="선택한 사진" />
        <video class="dict-photo" id="dictVideo" muted playsinline loop hidden></video>
      </div>

      <div class="dict-loading" id="dictLoading">
        <span class="dict-spinner"></span>
        <span>사전 정보를 불러오는 중이에요...</span>
      </div>

      <div class="dict-empty" id="dictEmpty" hidden>
        <p>사전 정보를 찾을 수 없어요</p>
        <span>그래도 아래에서 직접 입력해서 등록할 수 있어요</span>
      </div>

      <div class="dict-result" id="dictResult" hidden>
        <div class="dict-word-row">
          <input class="dict-word" id="dictWord" type="text" placeholder="영어 단어" />
          <span class="dict-flag" id="dictFlag">🇺🇸</span>
        </div>

        <div class="dict-speak-row">
          <button class="dict-speak-btn" id="btnSpeak" aria-label="발음 듣기">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="currentColor"/><path d="M8 10v4h2.5l3 3V7l-3 3H8Z" fill="#fff"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
          <input class="dict-phonetic-input" id="dictPhonetic" type="text" placeholder="발음 기호 (예: /ˈæp.əl/)" />
        </div>

        <div class="dict-tag-row">
          <input class="dict-tag-input" id="dictPos" type="text" placeholder="품사" />
        </div>

        <div class="edit-word-block">
          <label class="edit-word-label" for="editKoreanWord">한글 단어</label>
          <input class="edit-word-input" id="editKoreanWord" type="text" maxlength="30" />
        </div>

        <div class="dict-section">
          <div class="dict-section-label">뜻</div>
          <div class="dict-meanings-edit" id="dictMeanings"></div>
        </div>

        <div class="dict-section">
          <div class="dict-section-label">어원</div>
          <textarea class="edit-inline-textarea" id="dictEtymology" placeholder="어원 설명을 입력해주세요"></textarea>
        </div>

        <div class="dict-section">
          <div class="dict-section-label">동의어</div>
          <input class="edit-inline-input" id="dictSynonyms" type="text" placeholder="쉼표로 구분해서 입력 (예: glad, content)" />
        </div>

        <div class="dict-section">
          <div class="dict-section-label">반의어</div>
          <input class="edit-inline-input" id="dictAntonyms" type="text" placeholder="쉼표로 구분해서 입력 (예: sad, unhappy)" />
        </div>

        <div class="dict-section">
          <div class="dict-section-label">예문</div>
          <div id="dictExamples"></div>
        </div>

        <div class="dict-section">
          <div class="dict-section-label">숙어</div>
          <div id="dictIdioms"></div>
        </div>

        <div class="dict-section">
          <div class="dict-section-label">회화에서는</div>
          <div id="dictConversation"></div>
        </div>
      </div>
    </div>

    <footer class="dict-footer">
      <button class="dict-share-btn" id="btnShare">공유</button>
    </footer>
  </div>

  <script src="posts-store.js?v=5"></script>
  <script src="speak.js?v=5"></script>
  <script src="dictdata.js?v=19"></script>
  <script src="editable.js?v=1"></script>
  <script src="lookup.js?v=12"></script>
</body>
</html>
