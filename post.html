<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>단어 — 게시물</title>
<link rel="stylesheet" href="styles.css?v=1" />
<link rel="stylesheet" href="dictionary.css?v=2" />
<link rel="stylesheet" href="post.css?v=4" />
</head>
<body class="dict-body">
  <div class="dict-page post-page" id="postPage">
    <header class="post-topbar">
      <button class="dict-back" id="btnBack" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="post-user">
        <span class="post-avatar">D</span>
        <span class="post-username">dorina</span>
      </div>
      <button class="post-more" id="btnMore" aria-label="더보기">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
      </button>
    </header>

    <div class="post-content" id="postContent">
      <div class="post-photo-wrap">
        <img class="post-photo" id="postPhoto" alt="" />
        <video class="post-photo" id="postVideo" controls playsinline hidden></video>
      </div>

      <div class="post-actions">
        <button class="post-action-btn" id="btnLike" aria-label="좋아요">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 20.5s-7.5-4.6-9.6-9.3C.9 7.8 2.6 4.5 6 4c2-.3 3.7.7 6 3 2.3-2.3 4-3.3 6-3 3.4.5 5.1 3.8 3.6 7.2-2.1 4.7-9.6 9.3-9.6 9.3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button class="post-action-btn" id="btnComment" aria-label="댓글">
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3 20l1.1-5.2A8.5 8.5 0 1 1 21 11.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <span class="post-actions-spacer"></span>
        <button class="post-action-btn" id="btnBookmark" aria-label="북마크">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 4h12v16l-6-4-6 4V4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <p class="post-likes" id="postLikes"></p>

      <div class="dict-result">
        <div class="dict-word-row">
          <h1 class="dict-word" id="dictWord"></h1>
          <span class="dict-flag" id="dictFlag">🇺🇸</span>
        </div>

        <button class="dict-speak" id="btnSpeak" aria-label="발음 듣기">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="currentColor"/><path d="M8 10v4h2.5l3 3V7l-3 3H8Z" fill="#fff"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span class="dict-phonetic" id="dictPhonetic"></span>
        </button>

        <div class="dict-tag-row">
          <span class="dict-tag" id="dictPos"></span>
        </div>
        <ol class="dict-meanings" id="dictMeanings"></ol>

        <div class="dict-loading" id="dictEnrichLoading" hidden>
          <span class="dict-spinner"></span>
          <span>사전 정보를 불러오는 중이에요...</span>
        </div>

        <div class="dict-section" id="dictEtymologyBlock" hidden>
          <div class="dict-section-label">어원</div>
          <p class="dict-etymology" id="dictEtymology"></p>
        </div>

        <div class="dict-section" id="dictSynonymBlock" hidden>
          <div class="dict-section-label">동의어</div>
          <div class="dict-chip-row" id="dictSynonyms"></div>
        </div>

        <div class="dict-section" id="dictAntonymBlock" hidden>
          <div class="dict-section-label">반의어</div>
          <div class="dict-chip-row dict-chip-row--anto" id="dictAntonyms"></div>
        </div>

        <div class="dict-section" id="dictExampleBlock" hidden>
          <div class="dict-section-label">예문</div>
          <div class="dict-examples" id="dictExamples"></div>
        </div>

        <div class="dict-section dict-idiom-block" id="dictIdiomBlock" hidden>
          <div class="dict-section-label">숙어</div>
          <div class="dict-idioms" id="dictIdioms"></div>
        </div>

        <div class="dict-section" id="dictConversationBlock" hidden>
          <div class="dict-section-label">회화에서는</div>
          <div class="dict-conversation" id="dictConversation"></div>
        </div>
      </div>

      <div class="post-comments" id="postComments"></div>
    </div>

    <div class="post-notfound" id="postNotFound" hidden>
      <p>게시물을 찾을 수 없어요</p>
      <a class="post-back-link" href="index.html">홈으로 돌아가기</a>
    </div>
  </div>

  <!-- More menu (bookmark / delete) -->
  <div class="action-overlay" id="moreOverlay" hidden>
    <div class="more-sheet">
      <div class="sheet-handle"></div>
      <button class="more-action-btn" id="btnBookmarkAction">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 4h12v16l-6-4-6 4V4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span id="bookmarkActionLabel">저장</span>
      </button>
      <button class="more-action-btn" id="btnEditAction">
        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 24 24" width="20px" fill="currentColor"><path d="M0 0h24v24H0z" fill="none"/><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        <span>수정</span>
      </button>
      <button class="more-action-btn more-action-btn--danger" id="btnDeleteAction">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-.8 12.1a2 2 0 0 1-2 1.9H8.8a2 2 0 0 1-2-1.9L6 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>삭제</span>
      </button>
    </div>
  </div>

  <!-- Delete confirmation -->
  <div class="confirm-overlay" id="confirmOverlay" hidden>
    <div class="confirm-dialog">
      <p class="confirm-message">게시물을 삭제하시겠어요?</p>
      <button class="confirm-btn confirm-btn--danger" id="btnConfirmDelete">삭제</button>
      <button class="confirm-btn" id="btnCancelDelete">취소</button>
    </div>
  </div>

  <!-- Comment sheet -->
  <div class="action-overlay" id="commentOverlay" hidden>
    <div class="comment-sheet">
      <div class="sheet-handle"></div>
      <div class="comment-sheet-header">댓글</div>
      <div class="comment-sheet-list" id="commentSheetList"></div>
      <div class="comment-input-bar">
        <span class="comment-input-avatar" id="commentInputAvatar"></span>
        <input
          type="text"
          id="commentInput"
          class="comment-input"
          placeholder="회원님의 생각을 남겨보세요."
          aria-label="댓글 입력"
          autocomplete="off"
        />
        <button class="comment-send" id="btnCommentSend" aria-label="댓글 보내기">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12 20 4l-6 16-3-7-7-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Comment delete confirmation (내가 쓴 댓글을 꾹 눌렀을 때) -->
  <div class="confirm-overlay" id="commentDeleteConfirm" hidden>
    <div class="confirm-dialog">
      <p class="confirm-message">댓글을 삭제하시겠어요?</p>
      <button class="confirm-btn confirm-btn--danger" id="btnConfirmCommentDelete">삭제</button>
      <button class="confirm-btn" id="btnCancelCommentDelete">취소</button>
    </div>
  </div>

  <script src="posts-store.js?v=5"></script>
  <script src="speak.js?v=5"></script>
  <script src="dictdata.js?v=19"></script>
  <script src="postview.js?v=14"></script>
</body>
</html>
