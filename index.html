<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>단어 — 홈</title>
<meta name="description" content="사진 한 장으로 시작하는 이미지 기반 소셜 단어 학습, LEAP" />

<!-- 크롬/사파리에서 "홈 화면에 추가"로 저장할 때 쓰이는 아이콘 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="apple-touch-icon.png" />

<!-- Open Graph (카카오톡, 페이스북 등 링크 공유 시 미리보기) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="LEAP" />
<meta property="og:title" content="LEAP — 이미지로 배우는 단어" />
<meta property="og:description" content="사진 한 장으로 시작하는 이미지 기반 소셜 단어 학습 플랫폼" />
<meta property="og:image" content="https://dorinakim.github.io/leap/assets/ogp_image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://dorinakim.github.io/leap/" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="LEAP — 이미지로 배우는 단어" />
<meta name="twitter:description" content="사진 한 장으로 시작하는 이미지 기반 소셜 단어 학습 플랫폼" />
<meta name="twitter:image" content="https://dorinakim.github.io/leap/assets/ogp_image.png" />

<link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <a class="logo" id="logoHome" href="index.html">단어</a>
      <div class="search-bar" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="검색" aria-label="검색" />
      </div>
    </header>

    <!-- Content -->
    <main class="content">
      <section class="photo-grid" id="photoGrid" aria-label="등록된 단어 썸네일">
        <!-- tiles injected by app.js -->
      </section>
      <section class="photo-grid search-grid" id="searchGrid" aria-label="검색 결과" hidden></section>
    </main>

    <!-- Floating add button -->
    <button class="fab" aria-label="사진 등록하기">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 5V19M5 12H19" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Bottom navigation -->
    <nav class="gnb" aria-label="주요 메뉴">
      <div class="gnb-inner">
        <button class="gnb-item is-active" data-tab="home">
          <img class="icon-inactive" src="assets/icon-home.png" alt="" />
          <img class="icon-active" src="assets/icon-home_active.png" alt="" />
          <span>홈</span>
        </button>
        <button class="gnb-item" data-tab="feed">
          <img class="icon-inactive" src="assets/icon-feed.png" alt="" />
          <img class="icon-active" src="assets/icon-feed_active.png" alt="" />
          <span>피드</span>
        </button>
        <button class="gnb-item" data-tab="my">
          <img class="icon-inactive" src="assets/icon-mypage.png" alt="" />
          <img class="icon-active" src="assets/icon-mypage_active.png" alt="" />
          <span>마이페이지</span>
        </button>
      </div>
    </nav>
  </div>

  <script src="posts-store.js?v=9"></script>
  <script src="notice.js?v=9"></script>
  <script src="dictdata.js?v=19"></script>
  <script src="search.js?v=3"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
